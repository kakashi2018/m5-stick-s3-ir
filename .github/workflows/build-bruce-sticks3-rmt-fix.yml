
name: Build Bruce M5StickS3 IR RMT 1.16.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out patch bundle
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Download Bruce 1.16.1
        run: git clone --depth 1 --branch 1.16.1 https://github.com/BruceDevices/firmware.git bruce-1.16.1

      - name: Apply IR patch
        run: python apply_ir_fix.py bruce-1.16.1

      - name: Pin FastLED compatibility version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("bruce-1.16.1")
          changed = 0

          for file in root.rglob("*.ini"):
              if ".pio" in file.parts:
                  continue

              original = file.read_text()
              updated, count = re.subn(
                  r"(?im)^([ \t]*)(?:fastled/FastLED|FastLED)[ \t]*(?:@[^\r\n]*)?$",
                  r"\1fastled/FastLED @ 3.9.20",
                  original
              )

              if count:
                  file.write_text(updated)
                  print(f"Pinned FastLED in {file}")
                  changed += count

          if changed == 0:
              raise SystemExit("FastLED dependency not found")

          print("FastLED pinned to 3.9.20")
          PY

      - name: Compile firmware
        working-directory: bruce-1.16.1
        run: pio run --environment m5stack-sticks3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-M5StickS3-RMT-1.16.1-UNTESTED
          path: bruce-1.16.1/.pio/build/m5stack-sticks3/firmware.bin
          if-no-files-found: error
