name: Build Bruce M5StickS3 IR + FastLED Fix 1.16.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out patch bundle
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Clone official Bruce 1.16.1
        run: git clone --branch 1.16.1 --depth 1 https://github.com/BruceDevices/firmware.git bruce-1.16.1

      - name: Apply GPIO42 and FastLED fixes
        run: python apply_ir_fix.py bruce-1.16.1

      - name: Verify patches applied
        run: |
          grep -Fq 'setup_ir_pin(bruceConfigPins.irRx, INPUT_PULLUP);' bruce-1.16.1/src/modules/ir/ir_read.cpp
          grep -Fq 'fastled/FastLED @ 3.10.3' bruce-1.16.1/platformio.ini
          echo 'Both source-level patches verified.'

      - name: Compile Bruce for M5StickS3
        working-directory: bruce-1.16.1
        run: pio run -e m5stack-sticks3

      - name: Verify complete merged image
        run: |
          test -s bruce-1.16.1/Bruce-m5stack-sticks3.bin
          ls -lh bruce-1.16.1/Bruce-m5stack-sticks3.bin
          sha256sum bruce-1.16.1/Bruce-m5stack-sticks3.bin

      - name: Upload full image (flash at 0x0)
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-M5StickS3-1.16.1-IR-PULLUP-FastLED-3.10.3
          path: bruce-1.16.1/Bruce-m5stack-sticks3.bin
          if-no-files-found: error
